name: Compilar NEXOS OS APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/main.yml"
      - "NEXOS_OS_Android_projeto.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Extrair projeto Android
        run: |
          unzip -o NEXOS_OS_Android_projeto.zip -d .
          test -f NEXOS_OS_Android/settings.gradle.kts
          test -f NEXOS_OS_Android/app/build.gradle.kts
          echo "Arquivos do projeto:"
          find NEXOS_OS_Android -maxdepth 8 -type f | sort
          echo "::group::MainActivity.kt source for safe patching"
          sed -n '1,260p' NEXOS_OS_Android/app/src/main/java/com/nexos/os/MainActivity.kt
          echo "::endgroup::"
          echo "::group::AndroidManifest.xml"
          find NEXOS_OS_Android/app/src/main -name AndroidManifest.xml -exec sh -c 'echo "### $1"; cat "$1"' _ {} \;
          echo "::endgroup::"
          echo "::group::Gradle app configuration"
          sed -n '1,220p' NEXOS_OS_Android/app/build.gradle.kts
          echo "::endgroup::"

      - name: Corrigir import do verticalScroll
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NEXOS_OS_Android/app/src/main/java/com/nexos/os/MainActivity.kt")
          source = p.read_text()
          required = "import androidx.compose.foundation.verticalScroll"
          if required not in source:
              lines = source.splitlines(keepends=True)
              if not lines or not lines[0].startswith("package "):
                  raise SystemExit("Não foi possível localizar a declaração package em MainActivity.kt")
              lines.insert(1, required + chr(10))
              p.write_text("".join(lines))
              print("Import verticalScroll adicionado.")
          else:
              print("Import verticalScroll já existe.")
          PY

      - name: Publicar fontes para revisão técnica
        uses: actions/upload-artifact@v4
        with:
          name: NEXOS-OS-source-review
          path: |
            NEXOS_OS_Android/app/src/main/java/com/nexos/os/MainActivity.kt
            NEXOS_OS_Android/app/src/main/AndroidManifest.xml
            NEXOS_OS_Android/app/build.gradle.kts
            NEXOS_OS_Android/settings.gradle.kts
            NEXOS_OS_Android/build.gradle.kts
          if-no-files-found: warn
          retention-days: 7

      - name: Compilar APK debug
        working-directory: NEXOS_OS_Android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXOS-OS-debug-APK
          path: NEXOS_OS_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
