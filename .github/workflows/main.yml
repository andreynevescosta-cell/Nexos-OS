name: Compilar NEXOS OS APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/main.yml"
      - "NEXOS_OS_Android_projeto.zip"
      - "android-overlay/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Extrair projeto Android
        run: |
          unzip -o NEXOS_OS_Android_projeto.zip -d .
          test -f NEXOS_OS_Android/settings.gradle.kts
          test -f NEXOS_OS_Android/app/build.gradle.kts

      - name: Aplicar interface NEXOS e integração inicial com PPSSPP
        run: |
          install -D android-overlay/MainActivity.kt NEXOS_OS_Android/app/src/main/java/com/nexos/os/MainActivity.kt
          install -D android-overlay/AndroidManifest.xml NEXOS_OS_Android/app/src/main/AndroidManifest.xml
          echo "Overlay NEXOS aplicado: fullscreen, capas e seleção em dois toques."
          grep -n "applyImmersiveMode\|PLAYSTATION PORTABLE\|org.ppsspp.ppsspp" NEXOS_OS_Android/app/src/main/java/com/nexos/os/MainActivity.kt NEXOS_OS_Android/app/src/main/AndroidManifest.xml

      - name: Publicar fontes para revisão técnica
        uses: actions/upload-artifact@v4
        with:
          name: NEXOS-OS-source-review
          path: |
            NEXOS_OS_Android/app/src/main/java/com/nexos/os/MainActivity.kt
            NEXOS_OS_Android/app/src/main/AndroidManifest.xml
            NEXOS_OS_Android/app/build.gradle.kts
            NEXOS_OS_Android/settings.gradle.kts
            NEXOS_OS_Android/build.gradle.kts
          if-no-files-found: warn
          retention-days: 7

      - name: Compilar APK debug
        working-directory: NEXOS_OS_Android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXOS-OS-debug-APK
          path: NEXOS_OS_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
