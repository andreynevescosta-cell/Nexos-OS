name: Compilar NEXOS OS APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/main.yml"
      - "NEXOS_OS_Android_projeto.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Extrair projeto Android
        run: |
          unzip -o NEXOS_OS_Android_projeto.zip -d .
          test -f NEXOS_OS_Android/settings.gradle.kts
          test -f NEXOS_OS_Android/app/build.gradle.kts
          echo "Arquivos do projeto:"
          find NEXOS_OS_Android -maxdepth 5 -type f | sort

      - name: Corrigir import do verticalScroll
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NEXOS_OS_Android/app/src/main/java/com/nexos/os/MainActivity.kt")
          source = p.read_text()
          required = "import androidx.compose.foundation.verticalScroll"
          if required not in source:
              package_end = source.find("\\n")
              if package_end < 0:
                  raise SystemExit("Não foi possível localizar a declaração package em MainActivity.kt")
              source = source[:package_end + 1] + "\\n" + required + "\\n" + source[package_end + 1:]
              p.write_text(source)
              print("Import verticalScroll adicionado.")
          else:
              print("Import verticalScroll já existe.")
          PY

      - name: Compilar APK debug
        working-directory: NEXOS_OS_Android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXOS-OS-debug-APK
          path: NEXOS_OS_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
